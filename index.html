<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo PDF - Chuyên Ngữ Trung Ứng Dụng</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 300px;
        }
        h2 { color: #1f2937; margin-top: 0; margin-bottom: 15px; font-size: 20px;}
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .button-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 12px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; color: white;
            transition: background 0.3s;
        }
        .btn-preview { background-color: #4b5563; }
        .btn-preview:hover { background-color: #374151; }
        .btn-download { background-color: #c0504d; }
        .btn-download:hover { background-color: #a0403d; }
        
        iframe {
            width: 100%; height: 600px; border: 1px solid #d1d5db;
            border-radius: 8px; background: #e5e7eb;
        }

        /* --- CẤU TRÚC PDF CHIA TRANG --- */
        .pdf-wrapper { position: absolute; left: -9999px; top: -9999px; }
        #pdf-content { background-color: white; }
        
        /* Định dạng từng trang A4 */
        .pdf-page {
            width: 210mm;
            height: 297mm; /* Cố định chiều cao A4 */
            position: relative;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
            page-break-after: always; /* Tự động ngắt trang PDF sau thẻ này */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: white;
        }
        .pdf-page:last-child { page-break-after: auto; }

        .watermark {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130mm; height: 130mm;
            background-image: url('1000002164.jpg'); 
            background-size: contain; background-repeat: no-repeat;
            background-position: center; opacity: 0.15; z-index: 1;
        }
        .pdf-header {
            background-color: #c0504d; color: white;
            padding: 12px 20px; display: flex;
            justify-content: space-between; font-size: 14pt;
            font-weight: bold; z-index: 2; position: relative;
        }
        .pdf-body { 
            flex: 1; /* Đẩy footer xuống đáy trang */
            padding: 30px 40px; z-index: 2; position: relative; 
        }
        .pdf-text { font-size: 15pt; line-height: 2; white-space: pre-wrap; }
        .pdf-footer {
            padding: 0 40px 30px 40px; font-size: 13pt;
            z-index: 2; position: relative; text-align: left;
        }
        .pdf-footer a { color: #0000FF; text-decoration: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="panel">
            <h2>1. Nhập nội dung tài liệu</h2>
            <textarea id="inputText">23. 后来 (hòulái) Hâu lái - Sau này, sau đó
24. 最后 (zuìhòu) Chuây hâu - Cuối cùng</textarea>
            
            <div class="button-group">
                <button class="btn-preview" onclick="previewPDF()">👁️ Xem trước</button>
                <button class="btn-download" onclick="generatePDF()">⬇ Tải về PDF</button>
            </div>
        </div>

        <div class="panel">
            <h2>2. Bản xem trước</h2>
            <iframe id="pdf-preview" src=""></iframe>
        </div>
    </div>

    <!-- Khung chứa nội dung PDF (ẩn) -->
    <div class="pdf-wrapper">
        <div id="pdf-content"></div>
    </div>

    <script>
        function getPDFOptions() {
            return {
                margin:       [0, 0, 0, 0],
                filename:     'TaiLieu_TiengTrung.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
        }

        // Hàm xử lý tự động chia trang
        function updateContent() {
            const text = document.getElementById('inputText').value;
            // Tách chữ thành từng dòng
            const lines = text.split('\n');
            const linesPerPage = 20; // TỐI ĐA SỐ DÒNG 1 TRANG (Bạn có thể tăng/giảm số này)
            const container = document.getElementById('pdf-content');
            
            container.innerHTML = ''; // Xóa dữ liệu cũ

            // Vòng lặp cắt chữ và tạo trang mới
            for (let i = 0; i < lines.length; i += linesPerPage) {
                const chunk = lines.slice(i, i + linesPerPage).join('\n');
                
                const pageHTML = `
                    <div class="pdf-page">
                        <div class="watermark"></div>
                        <div class="pdf-header">
                            <span>TÀI LIỆU TIẾNG TRUNG</span>
                            <span>ID: @chuyennguchungungdung</span>
                        </div>
                        <div class="pdf-body">
                            <div class="pdf-text">${chunk}</div>
                        </div>
                        <div class="pdf-footer">
                            <p>Nhận tài liệu free qua TikTok: <b>@chuyennguchungungdung</b></p>
                            <p>Link: <a href="https://www.tiktok.com/@chuyennguchungungdung?_r=1&_t=ZS-99hcFGMJ61q">https://www.tiktok.com/@chuyennguchungungdung</a></p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', pageHTML);
            }
            return container;
        }

        function previewPDF() {
            const element = updateContent();
            html2pdf().set(getPDFOptions()).from(element).output('bloburl').then(function(url) {
                document.getElementById('pdf-preview').src = url;
            });
        }

        function generatePDF() {
            const element = updateContent();
            html2pdf().set(getPDFOptions()).from(element).save();
        }

        window.onload = function() {
            previewPDF();
        };
    </script>
</body>
</html>
